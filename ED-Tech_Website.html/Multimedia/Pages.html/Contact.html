<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Ninjas-Contact</title>
</head>
<body>
    <header>
        <a href="Homepage.html">
            <img src="../new_cn_logo.svg"/>
            </a>
            </header>
            <hr/>
        <section id="Contact info">
    <h1>Contact Details</h1>
    <p>For queries ,you can reach us via email or phone:</p>
    <p>
        Email:
        <a href="mailtocontact@codingninjas.com">contact@codingninjas.com</a>
    </p>
        Telephone:
        <a href="tel:1800-123-3598">1800-123-3598</a>
    </section>
    <hr/>
    <section id="map">
        <h2>Location Map</h2>
        <iframe  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224262.33130776652!2d77.01087874633248!3d28.566791951015126!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d1900297b6ad3%3A0xd587b3712b897066!2sCoding%20Ninjas!5e0!3m2!1sen!2sin!4v1784725627385!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </section>
    <br/>
    
    <section id="feedback form">
        <fieldset>
            <legend><b>Feedback Form</b></legend>
        <form>
            <label for="Name">Name:</label>
            <input type="name" id="Name" required name="name"
            />    
            <br/>
            <br/>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required
            placeholder="xyz@gmail.com"
            />  
            <br/>
            <br/>
            <label for="subject">Subject:</label>
            <input type="text" id="subject" required name="subject"
            />    
            <br/>
            <br/>   
            <label for="message">Message:</label>
            <input type="text" id="message" required name="message" rows="4"
            />    
            <br/>
            <br/>  
            <label for="selection">User Type:</label>
            <select id="selection" name="user type" >
                <option value="select">Select your user type</option>
                <option value="Teacher">Instructor</option>
                <option value="Student">Student</option>
            </select>
            <br/>
            <br/>
            <label for="coursetype">Select Course:</label>
            <select id="coursetype" name="select course">
                <option value="Course">Select your desire course</option>
                <option value="Course1">Course1-Web Development</option>
                <option value="Course2">Course2-Data Analyst</option>
                <option value="Course3">Course3-Digital Marketing</option>
                <option value="Course4">Course1-Android Development</option>
            </select>
            br/>
            <br/>
            <input type="submit" value="submit">
        </form>
    </section>
    </fieldset>
    
</body>
</html>
